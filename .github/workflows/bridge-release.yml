# The bridge (bridge-rs/, in Rust): its binaries for each machine, published as the release `bridge-<key>`.
# The key is a hash of the sources they come from: the tree of bridge-rs/, which holds everything the build reads (its
# embedded files in bridge-rs/assets/). Computed the same way by the installer (installer/bipinstall/rustbridge.py):
# sha256 of `git rev-parse HEAD:bridge-rs`, 12 characters. A checkout finds its own binaries without asking anyone.
#   Linux x86_64    servers, PCs, and Windows (BipAgents runs there in WSL2)
#   Linux aarch64   ARM servers (Hetzner CAX, Netcup…), Raspberry Pi, Windows on ARM
#   macOS           one universal binary (Apple Silicon and Intel)
# Linux builds target glibc 2.28 (cargo-zigbuild), so they run on every distribution of the last years.
name: Bridge binaries (Rust)

on:
  push:
    branches: [main, rust-bridge]
    paths: ["bridge-rs/**", ".github/workflows/bridge-release.yml"]
  workflow_dispatch:

permissions:
  contents: read   # the release job alone may write (it publishes)

concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  key:
    name: Release key
    if: github.repository == 'Alexbob0/BipAgents'   # installs download from the public repository
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false
      - id: key
        run: |
          test -d bridge-rs || { echo "key=" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "key=$(printf '%s' "$(git rev-parse HEAD:bridge-rs)" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ steps.key.outputs.key }}" ] || gh release view "bridge-${{ steps.key.outputs.key }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests
    needs: key
    if: needs.key.outputs.exists == 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0   # v2
        with:
          workspaces: bridge-rs
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  linux:
    name: Linux ${{ matrix.arch }}
    needs: [key, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.arch }}-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0   # v2
        with:
          workspaces: bridge-rs
          key: ${{ matrix.arch }}
      - run: pip install ziglang==0.14.1 cargo-zigbuild==0.23.4
      - name: Build
        working-directory: bridge-rs
        run: cargo zigbuild --release --locked --target ${{ matrix.arch }}-unknown-linux-gnu.2.28
      - name: Package
        run: |
          out=bridge-rs/target/${{ matrix.arch }}-unknown-linux-gnu/release
          tar -C "$out" -czf bipbridge-linux-${{ matrix.arch }}.tar.gz bipbridge bip-browser-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        with:
          name: linux-${{ matrix.arch }}
          path: bipbridge-linux-${{ matrix.arch }}.tar.gz

  macos:
    name: macOS (universal)
    needs: [key, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0   # v2
        with:
          workspaces: bridge-rs
      - name: Build both and join them
        working-directory: bridge-rs
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p universal
          for bin in bipbridge bip-browser-mcp; do
            lipo -create -output universal/$bin target/aarch64-apple-darwin/release/$bin target/x86_64-apple-darwin/release/$bin
          done
          tar -C universal -czf ../bipbridge-macos-universal.tar.gz bipbridge bip-browser-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        with:
          name: macos
          path: bipbridge-macos-universal.tar.gz

  release:
    name: Release bridge-${{ needs.key.outputs.key }}
    needs: [key, linux, macos]
    runs-on: ubuntu-latest
    # The only job that may write to the repository, and the only one given the release key (the environment's
    # secrets): it runs none of the build's code, only sha256sum, minisign and gh.
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8
        with:
          merge-multiple: true
      # SHA256SUMS signed with BipAgents' release key (installer/bipinstall/release_key.py checks it against the key
      # pinned in the checkout): a token that can change a release can't swap an archive and its sum together.
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sha256sum bipbridge-*.tar.gz > SHA256SUMS
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::No MINISIGN_SECRET_KEY secret: SHA256SUMS published unsigned (installs with a pinned release key refuse it)."
            exit 0
          fi
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q minisign >/dev/null
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/release.key" -m SHA256SUMS \
            -t "BipAgents bridge-${{ needs.key.outputs.key }} built from ${GITHUB_SHA::12}"
          rm -f "$RUNNER_TEMP/release.key"
          test -s SHA256SUMS.minisig
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signature=; [ -f SHA256SUMS.minisig ] && signature=SHA256SUMS.minisig
          gh release create "bridge-${{ needs.key.outputs.key }}" bipbridge-*.tar.gz SHA256SUMS $signature \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Bridge ${{ needs.key.outputs.key }}" \
            --notes "The bridge in Rust, built from ${GITHUB_SHA::12} (${GITHUB_REF_NAME}). Installs of this version fetch it by themselves (\`bipagents update\`, \`bipagents bridge rust\` again)."
