name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Bridge and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/requirements*.txt
      - run: pip install -r bridge/requirements-dev.txt
      - name: Bridge
        working-directory: bridge
        run: python -m pytest -q
      - name: Installer
        run: PYTHONPATH=installer:bridge python -m pytest -q installer/tests

  relay:
    name: Push relay (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  guichet:
    name: Guichet (Rust, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GUICHET_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # cargo test: one database, a schema per test (testing.rs); the copies' tests make whole databases next to it
      GUICHET_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/guichet_test
      # the black-box suite: a fresh database per test
      GUICHET_DB_SCRIPT: ${{ github.workspace }}/guichet-rs/scripts/ci-db.sh
      GUICHET_CMD: ${{ github.workspace }}/guichet-rs/target/release/bipguichet serve
    steps:
      - uses: actions/checkout@v7
      - name: PostgreSQL 17's client tools (pg_dump must not be older than the server) and restic
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common restic
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: psql "$GUICHET_PG_ADMIN_URL" -c "CREATE DATABASE guichet_test LOCALE 'C' TEMPLATE template0"
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guichet-rs
      - name: cargo fmt, clippy, test and the release binary
        working-directory: guichet-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: guichet/requirements*.txt
      - run: pip install -r guichet/requirements-dev.txt
      - name: The Python guichet's own tests (the reference)
        working-directory: guichet
        run: python -m pytest -q
      - name: The black-box suite against the Rust guichet
        working-directory: guichet
        run: python -m pytest tests_blackbox -q

  windows:
    name: Windows install script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.ps1 parses (Windows PowerShell 5.1, the one every PC has)
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }

  swift:
    name: HermesKit and VoiceKit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The newest Xcode on the runner: the voices' packages use the iOS SDK's latest asset-pack API.
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: HermesKit
        working-directory: Packages/HermesKit
        run: swift test
      - name: VoiceKit
        working-directory: Packages/VoiceKit
        run: swift test

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-configuration-cache
