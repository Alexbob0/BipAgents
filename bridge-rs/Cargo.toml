[package]
name = "bipbridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "BipAgents bridge for Hermes agents (Rust port of bridge/bipbridge, same routes, files and config)."
publish = false

[lib]
name = "bipbridge"
path = "src/lib.rs"
# The module docs are the Python docstrings (indented examples, not Rust).
doctest = false

[[bin]]
name = "bipbridge"
path = "src/main.rs"

[[bin]]
name = "bip-browser-mcp"
path = "src/bin/bip-browser-mcp.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
des = "0.8"
fancy-regex = "0.14"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
futures = "0.3"
glob = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio", "service"] }
include_dir = "0.7"
indexmap = { version = "2", features = ["serde"] }
jsonwebtoken = "9"
libc = "0.2"
md-5 = "0.10"
mime_guess = "2"
pem = "3"
percent-encoding = "2"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream", "multipart", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = { version = "0.8", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
# tools-knowledge: mail parsing, zip imports (notes), NFKD slugs, IMAP over rustls
mail-parser = { version = "0.11", features = ["full_encoding"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
encoding_rs = "0.8"
webpki-roots = "1"
# agents: YAML 1.1 events (PyYAML-compatible load/dump), Unicode categories (filenames), multipart parsing
yaml-rust2 = "0.10"
unicode-general-category = "1"
multer = "3"
# browsers-places: the desktop's websockify upstream (a WebSocket client over rustls)
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
flate2 = "1"
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"

# The tests make an RSA key at each run: its maths optimised even in debug builds.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
