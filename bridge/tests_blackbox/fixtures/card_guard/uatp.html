<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Paiement sécurisé</title></head>
<body>
<!-- Review round 2 (card-guards, 14/11): a payment page whose number field has no words of its own (its title is a
     div beside it, its placeholder digits only), as some hosted pages draw it. -->

  <div class="label">Numéro de carte</div>
  <input id="f1" inputmode="numeric" placeholder="1234 5678 9012 3456">
</form>
</body></html>
