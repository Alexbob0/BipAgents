<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créer un compte</title></head><body>
<!-- a terms box drawn by a web component (as Ionic's or Shoelace's checkboxes are): its input in a shadow root, its
     text in the page, slotted -->
<form id="customer-form">
  <label for="email">Adresse e-mail</label><input type="email" id="email" name="email">
  <terms-box id="cgu-box">J'accepte les conditions générales de vente</terms-box>
</form>
<script>
customElements.define("terms-box", class extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({mode: "open"});
    root.innerHTML = '<label><input type="checkbox" id="inner" name="cgu"> <slot></slot></label>';
    this.addEventListener("click", (e) => { if (e.target === this) root.getElementById("inner").click(); });
  }
  get checked() { return this.shadowRoot.getElementById("inner").checked; }
});
</script>
</body></html>
