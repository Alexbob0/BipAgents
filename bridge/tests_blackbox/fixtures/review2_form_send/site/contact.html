<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Contact</title></head><body>
<!-- a site's search (reading) and its contact form (sending: the site gets what the agent typed) -->
<form id="search" action="search" method="get" role="search">
  <input type="search" name="q" id="q"><button type="submit" id="find">Chercher</button>
</form>
<form id="contact" action="send" method="post">
  <label for="email">E-mail</label><input type="email" name="email" id="email">
  <label for="message">Message</label><input type="text" name="message" id="message">
  <button type="submit" id="go"><span>Envoyer</span></button>
</form>
</body></html>
