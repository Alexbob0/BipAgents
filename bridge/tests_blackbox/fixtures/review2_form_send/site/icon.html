<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Chat</title></head><body>
<!-- an icon send button: its name only in aria-label (nodriver's DOM.performSearch matches attribute values) -->
<form id="chat" action="send" method="post">
  <textarea name="message" id="message"></textarea>
  <button type="submit" id="go" aria-label="Envoyer le message"><svg width="12" height="12"></svg></button>
</form>
</body></html>
