<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créer un compte</title>
<style>.custom-checkbox input { position: absolute; opacity: 0; } .box { display: inline-block; width: 16px; height: 16px; border: 1px solid #333; }</style>
</head><body>
<!-- a PrestaShop sign-up form's consent box (theme « classic »: the real box hidden, a styled one drawn beside its text) -->
<form id="customer-form">
  <label for="email">Adresse e-mail</label><input type="email" id="email" name="email">
  <div class="form-group">
    <span class="custom-checkbox">
      <label class="psgdpr_consent_message">
        <input type="checkbox" name="psgdpr" id="psgdpr" value="1">
        <span class="box"><i class="material-icons rtl-no-flip checkbox-checked"></i></span>
        J'accepte les conditions générales et la politique de confidentialité
      </label>
    </span>
  </div>
</form>
</body></html>
