<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nouveau message</title></head><body>
<!-- a forum's compose form: its recipient picker is a search field, the form sends a message (POST) -->
<form id="compose" action="send" method="post">
  <label for="to">À</label><input type="search" name="to" id="to">
  <label for="body">Message</label><textarea name="body" id="body"></textarea>
  <button type="submit" id="post">Publier</button>
</form>
</body></html>
