<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créer un compte</title></head><body>
<!-- each box followed by its text in a <label> that is tied to nothing (no « for », box not inside): a common slip -->
<form id="customer-form">
  <label for="email">Adresse e-mail</label><input type="email" id="email" name="email">
  <div class="options">
    <input type="checkbox" name="opt1" id="opt1" value="1"><label class="lbl">Je souhaite recevoir la newsletter</label><br>
    <input type="checkbox" name="opt2" id="opt2" value="1"><label class="lbl">J'accepte les conditions générales de vente</label>
  </div>
</form>
</body></html>
