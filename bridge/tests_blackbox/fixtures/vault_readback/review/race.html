<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Espace client | Essai</title></head>
<body>
<!-- Review of vault-no-readback (16/11). A login form as a React page renders it when its component re-renders on a
     timer (a clock, a countdown, a carousel in the same tree): each render sets the controlled input from the state
     when the field differs (React's updateWrapper: node.value !== value → node.value = value; and its « value »
     attribute, defaultValue sync). `?every=4`: a render every 4 ms; `?every=frame`: at each frame (an animation held in
     the state); `?every=task`: one task after another (a page busy rendering). The race is the same whatever the pace;
     only how often a call meets it changes. Fake data only. -->
<h1>Espace client</h1>
<form id="login" action="/session" method="post">
  <label for="ident">Identifiant</label>
  <input type="text" name="login" id="ident" autocomplete="username">
  <label for="mdp">Mot de passe</label>
  <input type="password" name="mdp" id="mdp" autocomplete="current-password">
  <button type="submit" id="go">Se connecter</button>
</form>
<script>
  const pw = document.getElementById('mdp');
  const state = {password: ''};
  pw.addEventListener('input', () => { state.password = pw.value; });
  const render = () => {
    if (pw.value !== state.password) pw.value = state.password;
    if (pw.getAttribute('value') !== state.password) pw.setAttribute('value', state.password);
  };
  const every = new URLSearchParams(location.search).get('every') || '4';
  if (every === 'frame') { const tick = () => { render(); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  else if (every === 'task') { const c = new MessageChannel(); c.port1.onmessage = () => { render(); c.port2.postMessage(0); };
    c.port2.postMessage(0); }
  else setInterval(render, Number(every));
</script>
</body>
</html>
