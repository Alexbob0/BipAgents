<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créer un compte</title></head><body>
<!-- a single-page app's sign-up: no <form>, its button sends the fields itself (fetch) -->
<div id="signup">
  <label for="email">Adresse e-mail</label><input type="email" id="email">
  <label for="password">Mot de passe</label><input type="password" id="password">
  <label><input type="checkbox" id="cgu"> J'accepte les conditions générales de vente</label>
  <button type="button" id="create">Créer mon compte</button>
</div>
<script>
document.getElementById("create").addEventListener("click", () => {
  const pw = document.getElementById("password").value, cgu = document.getElementById("cgu").checked;
  fetch("collect?password_length=" + pw.length + "&cgu=" + cgu);   // the site's API, as received
});
</script>
</body></html>
