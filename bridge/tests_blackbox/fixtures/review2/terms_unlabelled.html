<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créer un compte</title></head><body>
<!-- terms boxes whose text is beside them, not in a <label>: a span next to it, or aria-labelledby -->
<form id="customer-form">
  <label for="email">Adresse e-mail</label><input type="email" id="email" name="email">
  <div class="consent"><input type="checkbox" name="terms" id="accept-terms" value="1">
    <span class="consent-text">J'accepte les conditions générales de vente</span></div>
  <div class="consent"><input type="checkbox" id="accept-privacy" aria-labelledby="privacy-text" value="1">
    <span id="privacy-text">J'accepte la politique de confidentialité</span></div>
</form>
</body></html>
