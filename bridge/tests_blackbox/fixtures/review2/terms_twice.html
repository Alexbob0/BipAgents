<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créer un compte</title>
<style>@media (min-width: 1px) { .mobile-only { display: none; } }</style></head><body>
<!-- a responsive page: the same sign-up form twice, the mobile copy hidden on this screen -->
<form id="signup-desktop">
  <label for="email">Adresse e-mail</label><input type="email" id="email" name="email">
  <p><label><input type="checkbox" name="cgu" id="cgu" value="1"> J'accepte les conditions générales de vente</label></p>
</form>
<form id="signup-mobile" class="mobile-only">
  <label for="email-m">Adresse e-mail</label><input type="email" id="email-m" name="email">
  <p><label><input type="checkbox" name="cgu" id="cgu-m" value="1"> J'accepte les conditions générales de vente</label></p>
</form>
</body></html>
