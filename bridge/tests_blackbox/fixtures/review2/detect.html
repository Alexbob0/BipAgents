<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Continuer</title></head><body>
<!-- what a bot-detection script can read while the agent clicks: the window's own symbol-keyed properties -->
<button id="go" onclick="window.seen = Object.getOwnPropertySymbols(window).map(String).join(',')">Continuer</button>
</body></html>
