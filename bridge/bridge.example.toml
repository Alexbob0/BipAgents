# BipAgents bridge — example configuration (no secrets here: open-source repository).
# Copy to ~/.config/hermes-ios/bridge.toml, then `chmod 600` that file.
# Alternative path: BRIDGE_CONFIG environment variable.
#
# Each secret can be given inline (`bridge_key = "…"`) or via a file
# (`bridge_key_file = "~/.config/hermes-ios/bridge.key"`); same for `hermes_key(_file)` and `ntfy_token(_file)`.

bridge_key = "CHANGE-ME-run-bipbridge-genkey"
host = "127.0.0.1"          # exposed on the tailnet via `tailscale serve`, never directly
port = 8643
log_level = "info"
data_dir = "~/.local/share/hermes-bridge"
public_url = "https://mamachine.tailnet.ts.net:8643"   # the bridge on the tailnet, for the pairing QR code
# Messages between agents (the app's « Qui peut écrire à qui »): the bridge is their only peer and checks each
# message against the links the person allowed. How the agents reach it (default http://127.0.0.1:<port>/peer):
# peer_url = "http://host.containers.internal:8643/peer"   # agents in containers

# Kyutai TTS 1.6B (Nvidia GPU): "classic" human voice and podcast. Optional: without a GPU (Mac mini, VPS),
# set `enabled = false` and keep [pocket]; the default voice then becomes `[pocket] default_voice`.
[kyutai]
enabled = true
url = "http://127.0.0.1:8097"
default_voice = "5476"      # Kyutai alias (default, 5476, 4193, 5207) or path cml-tts/fr/…_enhanced.wav
timeout_seconds = 120

# Kyutai Pocket TTS (CPU, first sound ≈ 50 ms) for the Bips' voices: the repo's pocket/pocket_server.py server,
# voices in voices/. "pocket:<name>" (pocket:colibri…) speaks French, "pocket:en/<name>", "pocket:es/<name>",
# "pocket:de/<name>" the other languages; any other voice goes to Kyutai. In French, Pocket missing or down →
# default Kyutai voice (if Kyutai is enabled). Remove the section to disable it.
[pocket]
url = "http://127.0.0.1:8098"
default_voice = "pocket:colibri"   # default voice when Kyutai is disabled

# Your own voice model (optional): any server with OpenAI's POST /v1/audio/speech (Fish Audio Drama 3 on audio.cpp,
# Kokoro, Kyutai…). Its voices are "server:<lang>/<id>" (the app lists them from GET /v1/audio/voices, else `voices`);
# each use below goes to it (true) or to the agent's Bip (false). Down or failing: a Bip of the same language speaks.
# [voice_server]
# url = "http://192.168.1.20:8099"
# model = "drama-3"          # the `model` it expects ("tts-1" by default)
# stream_rate = 44100        # it streams raw PCM at this rate (audio.cpp); absent: whole WAV files
# voices = []                # when it cannot list them
# live = true                # the Live
# replies = true             # spoken replies to voice notes
# reading = true             # messages and reports read aloud
# first_audio_seconds = 5    # a Live sentence or a spoken reply waits this long for its first sound (plus the text's
#                            # length for whole files), then the agent's Bip says it, and the next ones for 30 s

# Words the voices say wrong, respelled (whole words, any case), per language.
# [pronunciations.fr]
# Garmin = "Garmine"

[ntfy]
url = "http://127.0.0.1:8645"

# Replies from Hermes scheduled tasks (cron_… sessions), read directly from Hermes and put in the
# Inbox with a push, whatever the job's configured delivery (SimpleX, ntfy…). `[SILENT]` ignored.
[cron]
watch = true
interval_seconds = 30
window_hours = 12        # on first start, only tasks from the last N hours are picked up

# Files that agents point to with a "MEDIA:<path>" line (podcast mp3, image…): prefix as seen by
# the agent (inside its container) -> folder on the host. Only media files under these folders are served
# (GET /v1/media); an mp3 attached to an Inbox message becomes its audio, instead of a read-aloud.
[media.roots]
# "/home/hermes/.hermes/media" = "~/hermes-agent/hermes-home/media"

[fcm]
# The Android app's notifications: the Firebase project's service account key (JSON, mode 600), from the Firebase
# console › Project settings › Service accounts › Generate new private key. Without it, Android devices are sent
# through [push] relay_url like iPhones without an APNs key.
# service_account = "~/.config/bipagents/fcm.json"
# base_url = "https://fcm.googleapis.com"   # tests only, with token_url (default: the service account's token_uri)

# The agents' « Météo » (weather tool) needs nothing: MET Norway's forecast and OpenStreetMap's place search, free,
# reached from this server with only the place. Their `route` tool always gives a link that opens the maps app; with
# a Google Maps Platform key (Routes API on, billed per route by Google) it also gives the travel time, with the
# traffic, and the distance: then the route's places and times go to Google. The key is never shown to the agents.
# [maps]
# google_key_file = "~/.config/bipagents/google-maps.key"   # mode 600 (or google_key = "…")

[apns]
# Leave team_id/key_id empty to disable push.
team_id = ""                # Apple Developer Team ID (10 characters)
key_id = ""                 # Key ID of the APNs .p8 key
p8_path = "~/.config/hermes-ios/AuthKey_KEYID.p8"   # mode 600
bundle_id = "io.github.bipagents"   # = the app's BIP_BUNDLE_ID (Config/Local.xcconfig) if you changed it
environment = "sandbox"     # default for devices that don't specify one: sandbox (Xcode) | production (TestFlight/App Store)
# base_url = ""             # tests only: another host instead of Apple's (both environments); sandbox_url: the sandbox's

[push]
previews = false            # false: generic push body, the content is fetched over the tailnet by the extension
watch_followed_runs = true  # a run followed in voice mode stays watched (approvals) if the app goes to the background

[outbox]
db_path = "~/.local/share/hermes-bridge/bridge.db"
audio_dir = "~/.local/share/hermes-bridge/audio"
retention_days = 90
audio_max_chars = 2000      # beyond this, no audio pre-synthesis
audio_wait_seconds = 8      # max wait for the audio before sending the push

[limits]
upload_max_mb = 50
upload_retention_days = 30
upload_file_mode = "640"    # octal; see README (Hermes container user)
upload_dir_mode = "750"
sentence_max_chars = 180
tts_max_chars = 1000        # limit for POST /v1/tts/sentence
tts_cache_entries = 256
watch_max_minutes = 120
purge_interval_hours = 6

# The person's own Hermes, managed by this bridge: lets the app create agents (« + »). Written by the installer;
# leave it out for agents set up by hand. With Hermes in a container: `bin` is a wrapper running `hermes` inside it,
# `home` the HERMES_HOME folder on the host and `container_home` the same folder inside the container.
# [hermes]
# bin = "~/.local/bin/hermes"
# home = "~/.hermes"
# hub_url = "http://127.0.0.1:8642"                      # the multiplex gateway (one per person)
# public_hub_url = "https://mamachine.tailnet.ts.net:8642"
# container_home = "/home/hermes/.hermes"
# The agents cannot read this bridge's files: their tools run in a sandbox, or their Hermes in a container that does
# not see them. Only then does the bridge keep credentials (vault, services with a token). Set it after checking,
# from an agent's terminal, that this file and the bridge's data folder are out of reach.
# isolated = true

# Local-network door, for when Tailscale is down (no Internet, VPN off): the bridge also listens on the LAN over
# HTTPS with its own certificate (created in data_dir/lan, pinned by the app through the QR code) and relays Hermes.
# Open this port on the LAN only (firewall), never on the Internet.
[lan]
enabled = false
host = "0.0.0.0"
port = 8650
# address = "192.168.1.20"   # advertised to the app; detected when empty (set it when the bridge runs in a container)

# Agents' own spaces (the app's « Lui donner son propre espace »): an agent created in the shared hub moves into
# its own Hermes, so it may hold logins from the vault. Each space gets its own gateway on a local port (reached
# by the app through this bridge, nothing new on the tailnet) and, with podman or docker, its tools in a sandbox.
# [spaces]
# root = "~/.local/share/hermes-bridge/spaces"
# first_port = 8660        # the first free port from there
# sandbox = "auto"         # "none": never a sandbox (agents in a space then cannot hold logins)
# Own commands instead of a systemd/launchd service per space, e.g. a container each ({agent}, {home} filled in):
# start = "podman run -d --name hermes-space-{agent} ... "
# stop = "podman rm -f hermes-space-{agent}"
# container_home = "/home/hermes/.hermes"   # the space's HERMES_HOME inside that container (attachments)

[agents.wellness]
display_name = "Wellness"
hermes_url = "http://127.0.0.1:8642"
public_url = "https://mamachine.tailnet.ts.net:8642"   # its Hermes on the tailnet, for the pairing QR code
hermes_key = "CHANGE-ME-API_SERVER_KEY-of-wellness"
ntfy_topic = "hermes-wellness-out"
ntfy_token = "CHANGE-ME-tk_token-with-read-access"
upload_dir_host = "~/hermes-agent/hermes-home/profiles/wellness/uploads"
upload_dir_container = "/home/hermes/.hermes/profiles/wellness/uploads"
voice = "5476"

[agents.vie]
display_name = "Vie"
hermes_url = "http://127.0.0.1:8644"
hermes_key = "CHANGE-ME-API_SERVER_KEY-of-vie"
ntfy_topic = "hermes-vie-out"
ntfy_token = "CHANGE-ME-tk_token-with-read-access"
upload_dir_host = "~/hermes-agent/hermes-home/profiles/vie/uploads"
upload_dir_container = "/home/hermes/.hermes/profiles/vie/uploads"
voice = "5476"
# The agents' vault (Réglages → Coffre in the app): an agent may hold logins only when it has its own space
# (its own container or sandbox), never in a gateway shared with other agents. The bridge writes the items the
# person allows into the agent's Hermes vault with that agent's Python; the secret goes on stdin, never argv.
# isolated = true
# python = "podman exec -i hermes-vie /home/hermes/.local/share/hermes/python/bin/python3 -I"
# hermes_home = "/home/hermes/.hermes/profiles/vie"   # the agent's HERMES_HOME, as that Python sees it
# hermes_root = "/home/hermes/.hermes/hermes-agent"    # Hermes' code folder, when that Python needs it
# Its browser's desktop set up by hand (a VNC behind websockify, like a noVNC page): the bridge logs in itself and
# shows it in the app (« Bureau », Face ID), so the VNC port needs no publishing on the tailnet.
# desktop_vnc = "ws://127.0.0.1:6080/websockify"        # or "tcp://127.0.0.1:5901"
# desktop_vnc_password_file = "~/.config/hermes-vnc.pass" # the password in clear, or a vncpasswd file (chmod 600)
