<!-- The app's Carnet screen, drawn (the home) -->
    <figure class="nb-shot" role="img" aria-label="{{notebook.a11y}}">
      <div class="nbs" aria-hidden="true">
        <div class="nbs-top"><span class="nbs-av">A</span><span class="nbs-search"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></div>
        <p class="nbs-title">{{notebook.shot.title}}</p>
        <div class="nbs-card">
          <p class="nbs-label">{{notebook.shot.today}}</p>
          <p class="nbs-task"><i></i><span>{{notebook.shot.t1}}</span><small>{{notebook.shot.t1s}}</small></p>
          <p class="nbs-task"><i></i><span>{{notebook.shot.t2}}</span></p>
          <p class="nbs-task done"><i></i><span>{{notebook.shot.t3}}</span></p>
        </div>
        <div class="nbs-trip"><span class="nbs-trip-bip" data-bip-static="home"></span><span><b>{{notebook.shot.trip}}</b><small>{{notebook.shot.tripSub}}</small></span></div>
        <div class="nbs-card nbs-kinds">
          <p><span>{{notebook.shot.k1}}</span><b>12</b></p>
          <p><span>{{notebook.shot.k2}}</span><b>7</b></p>
          <p><span>{{notebook.shot.k3}}</span><b>9</b></p>
          <p><span>{{notebook.shot.k4}}</span><b>2</b></p>
          <p class="nbs-arch"><span>{{notebook.shot.archives}}</span><small>{{notebook.shot.archivesSub}}</small></p>
        </div>
      </div>
    </figure>
