<!-- The app's own demo (its scenarios, played in a chat by site.js): its page /demo/ (the home has its own window). -->
  <div class="demo-grid" data-demo>
    <div class="demo-copy reveal">
      <p class="kicker">{{demo.kicker}}</p>
      <h1 class="page-h1">{{demo.title}}</h1>
      <p class="sub">{{demo.sub}}</p>
      <div class="tabs" role="tablist" aria-label="{{demo.tabs}}">
{{demotabs}}
      </div>
      <ul class="checks">
        <li>{{demo.point1}}</li><li>{{demo.point2}}</li><li>{{demo.point3}}</li>
      </ul>
    </div>
    <div class="chat-wrap reveal">
      <div class="chat" id="chat" role="tabpanel" aria-label="{{demo.chatLabel}}">
        <div class="chat-head">
          <span class="chat-avatar" data-bip-chat></span>
          <span class="chat-title"><span><b class="chat-name"></b> <span class="ai">{{ai}}</span></span><small>{{demo.chatSub}}</small></span>
          <button class="replay" type="button" aria-label="{{demo.replay}}">↻</button>
        </div>
        <div class="chat-body"></div>
        <div class="chat-input" aria-hidden="true"><span>{{demo.placeholder}}</span><i class="mic"></i></div>
      </div>
    </div>
  </div>
