<!-- The variants' « Voir la démo »: the app's whole demo (every scenario, played by site.js) in a window over the page.
     Without the script the links open /demo/. -->
<dialog class="v-demo" id="v-demo" aria-label="{{v.dialog}}">
  <button type="button" class="v-demo-close" aria-label="{{v.close}}"><span aria-hidden="true">×</span></button>
  <div class="v-demo-in">
{{>demoapp}}
  </div>
</dialog>
