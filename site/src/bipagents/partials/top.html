<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{pagetitle}}</title>
<meta name="description" content="{{pagedesc}}">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://bipagents.com{{path}}">
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{pagetitle}}">
<meta property="og:description" content="{{pagedesc}}">
<meta property="og:url" content="https://bipagents.com{{path}}">
<meta property="og:image" content="https://bipagents.com/assets/og-{{lang}}.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/nunito.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/assets/site.css?v={{version}}">
</head>
<body data-checkout="{{checkoutstate}}" data-page="{{pagename}}">
<a class="skip" href="#main">{{a11y.skip}}</a>

<header class="top" id="top">
  <a class="brand" href="{{home}}" aria-label="BipAgents">
    <span class="brand-bip" data-bip="daily" aria-hidden="true"></span>
    <span class="brand-name">Bip<b>Agents</b></span>
  </a>
  <nav class="top-links" aria-label="{{a11y.nav}}">
    <a href="{{home}}#private">{{nav.privacy}}</a>
    <a href="{{home}}#uses">{{nav.features}}</a>
    <a href="{{home}}#pricing">{{nav.pricing}}</a>
    <a href="{{demohref}}"{{cur.demo}}>{{nav.demo}}</a>
    <a href="{{faqhref}}"{{cur.faq}}>{{nav.faq}}</a>
  </nav>
  <div class="top-actions">
    <details class="lang">
      <summary aria-label="{{a11y.language}}">{{lang.short}}</summary>
      <div class="lang-menu">{{langmenu}}</div>
    </details>
    <a class="pill pill-ink small top-cta" href="{{betahref}}"{{cur.beta}}><span class="cta-long">{{nav.cta}}</span><span class="cta-short">{{nav.ctaShort}}</span></a>
  </div>
  <div class="progress" aria-hidden="true"><i></i></div>
</header>

<main id="main">
