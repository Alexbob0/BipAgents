<!-- An agent offers to tell Sam; at Sam's, the notification (the home, its variants) -->
      <figure class="fam-mock" role="img" aria-label="{{family.a11y}}">
        <div class="fam-card" aria-hidden="true">
          <p class="fam-from"><span class="fam-av" data-bip-static="daily"></span>{{family.mock.agent}}</p>
          <p class="fam-ask">{{family.mock.ask}}</p>
          <p class="fam-words">{{family.mock.words}}</p>
          <p class="fam-to">{{family.mock.to}} <span class="fam-chip">Sam <i>×</i></span></p>
          <div class="fam-btns"><span class="on">{{family.mock.send}}</span><span>{{family.mock.no}}</span></div>
        </div>
        <div class="fam-notif" aria-hidden="true"><small>{{family.mock.at}}</small><span>🔔 {{family.mock.notif}}</span></div>
      </figure>
